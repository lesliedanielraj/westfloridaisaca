# OWASP ZAP baseline rules for the pull-request scan. Tab-separated: rule id, action (IGNORE, WARN or FAIL), note.
# Anything not listed keeps ZAP's default, and any warning fails the pull request.
#
# The two below are notes, not weaknesses, and ZAP raises them on every scan of this kind of site whatever
# the site does, so they are switched off. Every rule that reports a weakness is left on.
10049	IGNORE	Cache report. Always raised, as "storable", "not cacheable" or "not storable". The site sends no-store on everything but its fingerprinted files.
10109	IGNORE	Says the site is built with JavaScript, which it is.
