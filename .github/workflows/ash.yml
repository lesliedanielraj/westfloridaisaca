# Checks on every pull request into main. Each one fails the pull request.
# - ASH, the AWS Automated Security Helper: any finding of medium severity or higher. It posts a
#   summary as a comment and keeps the full reports as the "ash_output" artifact of the run.
# - Tests and live scan: the backend tests, then a fuzz of the API and an OWASP ZAP scan of the
#   running site, on made-up data.
# - No member data: a report, database, archive or key file is tracked.
# - No personal details: Presidio finds personal details in the contents of a tracked file.
name: Pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ash-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  no-member-data:
    name: No member data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if a report, database, archive or key is in the repository
        run: |
          found=$(git ls-files | grep -iE '(^|/)(raw|data)/|\.(xlsx?|xlsm|csv|tsv|parquet|db|db-journal|db-wal|db-shm|sqlite3?|bak|dump|zip|tgz|tar|gz|7z|key|pem)$|(^|/)\.env(\.|$)' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed. Member data and keys stay off GitHub:"
            echo "$found"
            exit 1
          fi
          echo "No report, database, archive or key is tracked."
  pii-scan:
    name: No personal details
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-pii.txt
      - name: Install Presidio and its language model
        run: pip install --quiet -r tools/requirements-pii.txt
      - name: Read every tracked file for emails, phone, ID and card numbers and people's names
        run: git ls-files -z | python tools/pii_scan.py

  tests-and-live-scan:
    name: Tests and live scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend --no-audit --no-fund
      - name: Backend tests, including the check that every API route needs a sign-in
        run: python -m pytest backend -q
      - name: Build the site
        run: npm run build --prefix frontend
      - name: Start the site on made-up data
        run: |
          TOKEN=$(python tools/demo_setup.py "$RUNNER_TEMP/demo")
          echo "::add-mask::$TOKEN"
          echo "WF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          MEMBERS_DB="$RUNNER_TEMP/demo/members.db" ACCOUNTS_DB="$RUNNER_TEMP/demo/accounts.db" \
            nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health
      - name: A stranger is turned away
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/summary)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: wf_session=$WF_TOKEN" http://127.0.0.1:8000/api/summary)" = "200"
      - name: Fuzz the API with Schemathesis
        run: |
          schemathesis run http://127.0.0.1:8000/api/openapi.json --header "Cookie: wf_session=$WF_TOKEN" \
            --exclude-path-regex '^/api/auth/' --max-examples 60
      - name: Scan the running site with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: .zap/rules.conf
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
      - name: Server log, if anything failed
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/server.log"

  ash:
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@f356ca77388a4c58bcf25d904a21121ab8872a66 # v3.8.0
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      # No ash-version: the job installs the ASH of the commit pinned on the uses line.
      ash-args: --fail-on-incomplete-scanners --no-allow-stale-content-db
      collect-sarif-report: false
