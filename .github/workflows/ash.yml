# Security scan with ASH, the AWS Automated Security Helper, on every pull request into main.
# It fails the pull request on any finding of medium severity or higher, posts a summary as a
# comment, and keeps the full reports as the "ash_output" artifact of the run.
# Two more checks fail the pull request: one if a report, database, archive or key file is tracked,
# and one if Presidio finds personal details in the contents of any tracked file.
name: ASH security scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ash-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  no-member-data:
    name: No member data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail if a report, database, archive or key is in the repository
        run: |
          found=$(git ls-files | grep -iE '(^|/)(raw|data)/|\.(xlsx?|xlsm|csv|tsv|parquet|db|db-journal|db-wal|db-shm|sqlite3?|bak|dump|zip|tgz|tar|gz|7z|key|pem)$|(^|/)\.env(\.|$)' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed. Member data and keys stay off GitHub:"
            echo "$found"
            exit 1
          fi
          echo "No report, database, archive or key is tracked."
  pii-scan:
    name: No personal details
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-pii.txt
      - name: Install Presidio and its language model
        run: pip install --quiet -r tools/requirements-pii.txt
      - name: Read every tracked file for emails, phone, ID and card numbers and people's names
        run: git ls-files -z | python tools/pii_scan.py

  ash:
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@f356ca77388a4c58bcf25d904a21121ab8872a66 # v3.8.0
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      # No ash-version: the job installs the ASH of the commit pinned on the uses line.
      ash-args: --fail-on-incomplete-scanners --no-allow-stale-content-db
      collect-sarif-report: false
